name: Windows Forms - build e verificacao
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
      - name: Restaurar dependencias
        run: nuget restore Tecnologia.sln -NonInteractive
      - name: Compilar aplicativo
        run: msbuild Tecnologia.sln /p:Configuration=Release '/p:Platform=Any CPU' /m
      - name: Construir e verificar as telas
        shell: pwsh
        run: |
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          & $compiler /nologo /target:exe '/out:Tecnologia\bin\Release\VisualSmoke.exe' /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Core.dll /r:System.Design.dll '.\tests\VisualSmoke.cs'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./Tecnologia/bin/Release/VisualSmoke.exe ./Tecnologia/bin/Release/Tecnologia.exe ./verificacao-telas
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verificacao-windows
          path: |
            verificacao-telas
            Tecnologia/bin/Release
          retention-days: 7
      - name: Testar contas, manutencao e estoque com MySQL isolado
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'mysql-verificacao'
          & mysqld --no-defaults --initialize-insecure "--datadir=$data"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Start-Process (Get-Command mysqld).Source -ArgumentList @('--no-defaults', "--datadir=$data", '--port=3307', '--bind-address=127.0.0.1', '--console') -RedirectStandardOutput "$env:RUNNER_TEMP/mysql-out.log" -RedirectStandardError "$env:RUNNER_TEMP/mysql-error.log"
          $ready = $false
          for ($i = 0; $i -lt 45; $i++) {
            $client = [System.Net.Sockets.TcpClient]::new()
            try { $client.Connect('127.0.0.1', 3307); $ready = $true; break } catch { Start-Sleep -Seconds 1 } finally { $client.Dispose() }
          }
          if (!$ready) { Get-Content "$env:RUNNER_TEMP/mysql-error.log"; throw 'MySQL não iniciou' }
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          & $compiler /nologo /target:exe '/out:Tecnologia\bin\Release\IntegrationSmoke.exe' /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Core.dll /r:System.Data.dll /r:System.Configuration.dll '/r:Tecnologia\bin\Release\MySqlConnector.dll' '/r:Tecnologia\bin\Release\Tecnologia.exe' '.\tests\IntegrationSmoke.cs'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $config = [xml](Get-Content Tecnologia/bin/Release/Tecnologia.exe.config)
          $config.configuration.connectionStrings.add.connectionString = 'Server=127.0.0.1;Port=3307;Database=tecnologia_verificacao;Uid=root;Pwd=;SslMode=None;AllowPublicKeyRetrieval=True;'
          $config.Save((Join-Path $pwd 'Tecnologia/bin/Release/IntegrationSmoke.exe.config'))
          & ./Tecnologia/bin/Release/IntegrationSmoke.exe ./Banco/tecnologia.sql
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:RUNNER_TEMP/mysql-error.log"; exit 1 }
